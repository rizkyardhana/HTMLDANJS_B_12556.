<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form - 12556</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <ul class="menu">
      <li><a href="htmlcssbasic_b_12556.html">Kembali ke Halaman Utama</a></li>
      <li><a href="jsbasic_b_12556.html">Halaman Javascript</a></li>
  </ul>

  <h2>Form Pendaftaran Mahasiswa</h2>

  <form onsubmit="return validateForm()">
    <table cellspacing="4" cellpadding="4">
      <!-- TODO: Tambahkan field input teks untuk Nama Mahasiswa dengan tipe teks dan WAJIB DIISI. -->
      <tr>
        <td><strong>Nama Mahasiswa</strong></td>
        <td><input required type="text" id="namamhs" name="namamhs" size="30" /></td>
      </tr> 

      <!-- TODO: Tambahkan field radio button untuk Jenis Kelamin (Laki-laki dan Perempuan) dan WAJIB DIISI -->
      <tr>
        <td><strong>Jenis Kelamin</strong></td>
        <td>
          <input type="radio" id="lakiLaki" name="jenisKelamin" value="Laki-laki" required>
          <label for="lakiLaki">Laki-laki</label>
          <input type="radio" id="perempuan" name="jenisKelamin" value="Perempuan" required>
          <label for="perempuan">Perempuan</label>
        </td>
      </tr>

      <!-- TODO: Tambahkan dropdown untuk Program Studi dengan id="prodi", 
           opsi: "Pilih Prodi", "Informatika", "Teknik Industri", "Sistem Informasi" dan WAJIB DIISI. -->
      <tr>
        <td><strong>Program Studi</strong></td>
        <td>
          <select id="prodi" name="prodi" required>
            <option value="">Pilih Prodi</option>
            <option value="Informatika">Informatika</option>
            <option value="Teknik Industri">Teknik Industri</option>
            <option value="Sistem Informasi">Sistem Informasi</option>
          </select>
        </td>
      </tr>

      <!-- TODO: Tambahkan field input angka untuk Nomor Telepon dengan tipe number dan WAJIB DIISI. -->
      <tr>
        <td><strong>Nomor Telepon</strong></td>
        <td><input type="number" id="noTelp" name="noTelp" required></td>
      </tr>

      <!-- TODO: Tambahkan field input tanggal untuk Tanggal Lahir dengan tipe date dan WAJIB DIISI. -->
      <tr>
        <td><strong>Tanggal Lahir</strong></td>
        <td><input type="date" id="tglLahir" name="tglLahir" required></td>
      </tr>

      <!-- TODO: Tambahkan field input email dengan tipe email dan WAJIB DIISI. -->
      <tr>
        <td><strong>Email</strong></td>
        <td><input type="email" id="email" name="email" size="30" required></td>
      </tr>

      <!-- TODO: Tambahkan field input password dengan tipe password dan WAJIB DIISI. -->
      <tr>
        <td><strong>Password</strong></td>
        <td><input type="password" id="password" name="password" size="30" required></td>
      </tr>

      <!-- TODO: Tambahkan fieldset untuk Hal Favorit, berisi:
           - Fieldset "Game" dengan checkbox untuk Roblox, Magic Chess, dan beberapa game lain yang ingin kamu tambahkan.
           - Fieldset "Film" dengan checkbox untuk Drama, Action, Romance, Comedy, Horror.
       -->
      <tr>
        <td><strong>Hal Favorit</strong></td>
        <td>
          <fieldset>
            <legend>Game</legend>
            <input type="checkbox" id="roblox" name="game" value="Roblox">
            <label for="roblox">Roblox</label><br>
            <input type="checkbox" id="magicChess" name="game" value="Magic Chess">
            <label for="magicChess">Magic Chess</label><br>
            <input type="checkbox" id="minecraft" name="game" value="Minecraft">
            <label for="minecraft">Minecraft</label>
          </fieldset>
          <fieldset>
            <legend>Film</legend>
            <input type="checkbox" id="drama" name="film" value="Drama">
            <label for="drama">Drama</label><br>
            <input type="checkbox" id="action" name="film" value="Action">
            <label for="action">Action</label><br>
            <input type="checkbox" id="romance" name="film" value="Romance">
            <label for="romance">Romance</label><br>
            <input type="checkbox" id="comedy" name="film" value="Comedy">
            <label for="comedy">Comedy</label><br>
            <input type="checkbox" id="horror" name="film" value="Horror">
            <label for="horror">Horror</label>
          </fieldset>
        </td>
      </tr>
           
      <!-- TODO: Tambahkan textarea untuk Deskripsi dengan id="deskripsi" dan WAJIB DIISI. -->
      <tr>
        <td><strong>Deskripsi Diri</strong></td>
        <td><textarea id="deskripsi" name="deskripsi" rows="5" cols="30" required></textarea></td>
      </tr>

      <!-- TODO: Tambahkan field input Foto dengan tipe file dan WAJIB DIISI. -->
      <tr>
        <td><strong>Unggah Foto</strong></td>
        <td><input type="file" id="foto" name="foto" accept="image/*" required></td>
      </tr>

      <!-- TODO: Tambahkan tombol submit dengan id="simpan" dan value="Simpan". -->

      <tr>
        <td colspan="2" style="text-align: center;">
          <input type="submit" id="simpan" value="Simpan">
        </td>
      </tr>

    </table>
  </form>

  <script>
    const validateForm = () => {
      alert("Data Berhasil Disimpan !");
      // Untuk mencegah form submit dan reload halaman, bisa tambahkan return false;
      // Namun, karena ada alert, biasanya ini sudah cukup untuk menunjukkan interaksi.
      // Jika ingin form benar-benar tidak submit, tambahkan event.preventDefault() dan return false;
      return true; // Mengembalikan true agar form tetap bisa disubmit setelah alert
    };
  </script>
</body>
</html>
